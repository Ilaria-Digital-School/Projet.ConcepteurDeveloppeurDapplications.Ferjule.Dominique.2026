            <form class="formulaire">
                <h2>Inscription</h2>

                <fieldset class="inscription-fieldset">
                    <legend>Informations Personnelles</legend>
                    <div>
                        <label for="nom">Nom :</label>
                        <input type="text" name="nom" id="nom" placeholder="Nom de l'utilisateur" required>
                    </div>

                    <div>
                        <label for="email">Email de l'utilisateur :</label>
                        <input type="email" id="email" placeholder="exemple@gmail.com" required>
                    </div>

                    <div>
                        <label for="mdp">Mot de passe :</label>
                        <input type="password" id="mdp" placeholder="Mot de passe attribué à l'utilisateur" required>
                    </div>
                </fieldset>

                <button type="submit">Enregistrer un utilisateur</button>             

            </form>
