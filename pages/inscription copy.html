<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Lien vers fichier CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <!-- Titre Principal -->
        <h1>My Shop</h1>
        <!-- Menu de navigation simple -->
        <ul>
            <li>
                <a href="../index.html">Acceuil</a>
            </li>
            <li>
                <a href="about.html">A propos</a>
            </li>
            <li>
                <a href="products.html">Produits</a>
            </li>
            <li>
                <a href="inscription.html">Inscription</a>
            </li>
            <li>
                <a href="connexion.html">Connexion</a>
            </li>
            <li>
                <a href="contact.html">Contact</a>
            </li>
        </ul>
    </header>

    <main>
            <form class="formulaire">
                <h2>Inscription</h2>

                <fieldset class="inscription-fieldset">
                    <legend>Informations Personnelles</legend>
                    <div>
                        <label for="nom">Nom :</label>
                        <input type="text" name="nom" id="nom" placeholder="Votre nom" required>
                    </div>

                    <div>
                        <label for="email">Email :</label>
                        <input type="email" id="email" placeholder="exemple@gmail.com" required>
                    </div>

                    <div>
                        <label for="mdp">Mot de passe :</label>
                        <input type="password" id="mdp" placeholder="Votre mot de passe" required>
                    </div>
                </fieldset>

                <fieldset class="inscription-fieldset">
                    <legend>Informations Supplémentaires</legend>
                    <!-- Radio -->
                    <div>
                        <label>Genre :</label>
                        <input type="radio" id="femme" name="genre" value="femme">
                        <label for="femme"> Femme </label>

                        <input type="radio" id="homme" name="genre" value="homme">
                        <label for="homme"> Homme </label>
                    </div>

                    <!-- Checkbox -->
                    <div>
                        <label>Intérets :</label>
                        <input type="checkbox" name="interets" id="vetements" value="vetements">
                        <label for="vetements">vetements</label>

                        <input type="checkbox" name="interets" id="accessoires" value="accessoires">
                        <label for="accessoires">Accessoires</label>
                    </div>

                    <!-- Pays -->
                    <div>
                        <label for="pays">Pays :</label>
                        <select name="pays" id="pays">
                            <option value="france">France</option>
                            <option value="tunisie">Tunisie</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </fieldset>

                <button type="submit">S'inscrire</button>

                <div>
                    <p>Vous avez déjà un compte ?
                        <a href="connexion.html">Se connecter</a>
                    </p>
                </div>

            </form>
    </main>


    <!-- Pied de page -->
    <footer>
        <h2>Contactez-Nous : </h2>
        <a href="https://www.decathlon.fr/" target="_blank">Facebook</a>
        <a href="mailto:myshop@gmail.com">myshop@gmail.com</a>
        <a href="tel:123456789">123456789</a>
        <a href="" download>Mentions légales</a>
    </footer>

</body>

</html>
