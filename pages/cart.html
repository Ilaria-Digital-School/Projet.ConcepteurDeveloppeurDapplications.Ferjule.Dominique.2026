<head>

    <!-- Lien vers fichier CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Lien FontAwsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <header>
        <!-- Titre Principal -->
        <h1>My Shop</h1>
        <!-- Menu de navigation simple -->
        <ul>
            <li>
                <a href="../index.html">Acceuil</a>
            </li>

            </li>

                <a href="contact.html">Contact</a>
            </li>
        </ul>
    </header>


    <main>
        <section>
            <h2>Mon Panier</h2>
            <!-- =========================
                 TABLEAU BOOTSTRAP

                 🔹 table
                 → active le style Bootstrap du tableau

                 🔹 table-bordered
                 → ajoute des bordures au tableau

                 🔹 border-danger
                 → change la couleur des bordures
                     (danger = rouge Bootstrap)

                 🔹 table-hover
                 → ajoute un effet hover sur les lignes
            ========================= -->
            <table class="table table-bordered border-danger table-hover">
                <thead class="table-warning">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Produit</th>
                        <th scope="col">Prix</th>
                        <th scope="col">Quantité</th>
                        <th scope="col">Total</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Chemise</td>
                        <td>20</td>
                        <td>1</td>
                        <td>20</td>
                        <td>
                            <button type="button" class="btn btn-danger">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                       <th scope="row">1</th>
                        <td>Robe</td>
                        <td>15</td>
                        <td>2</td>
                        <td>30</td>
                        <td>
                            <button type="button" class="btn btn-danger">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5">Total</td>
                        <td>
                            <button type="button" class="btn btn-success">Commander</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Pied de page -->
    <footer>

        <a href="https://www.decathlon.fr/" target="_blank">Facebook</a>
        <a href="mailto:myshop@gmail.com">myshop@gmail.com</a>
        <a href="tel:123456789">123456789</a>
        <a href="" download>Mentions légales</a>
    </footer>

    <!-- Lien JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
